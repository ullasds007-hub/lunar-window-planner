name: Lunar product checks
on:
  push:
    branches: [feature/landing-first]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      LUNAR_REQUIRE_DATA: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q app
      - run: node --check app/static/compare.js
      - run: python prepare_combined.py
      - run: python -m pytest -q tests/test_lunar_product.py
